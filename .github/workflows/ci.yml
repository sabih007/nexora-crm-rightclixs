name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs against a real PostgreSQL service container, not the embedded
  # development database, so the migrations are exercised the way production
  # will apply them.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora_ci?schema=public
  AUTH_SECRET: ci-only-auth-secret-value-at-least-32-characters-long
  CRON_SECRET: ci-only-cron-secret-value
  APP_URL: http://127.0.0.1:3210
  STORAGE_DRIVER: local
  EMAIL_DRIVER: log
  WORKSPACE_BASE_CURRENCY: PKR
  WORKSPACE_TIMEZONE: UTC
  LOG_LEVEL: error

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        # These bring up their own embedded PostgreSQL per run, so they are
        # independent of the service container above.
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the job on a high or critical advisory; moderate issues are
      # reported but do not block, so a transitive dev-only advisory cannot
      # stop a deploy.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
